<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Juletræssange</title>
  <meta name="description" content="Teksterne til de danske julesange og julesalmer – til at gå om juletræet juleaften.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Juletræssange">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Index of all carols -->
  <main id="index-view" class="view" hidden>
    <h1 class="index-title">Juletræssange</h1>

    <div class="verse-switch">
      <button type="button" class="switch-label" id="label-short">Udvalgte vers</button>
      <input type="checkbox" class="switch" id="all-verses" role="switch" aria-label="Alle vers">
      <button type="button" class="switch-label" id="label-all">Alle vers</button>
    </div>

    <ol id="song-list" class="song-list"></ol>
    <p id="list-empty" class="list-empty" hidden></p>

    <footer class="index-footer">
      <div id="qr" class="qr"></div>
      <p class="qr-caption">Del med denne</p>
    </footer>
  </main>

  <!-- One song -->
  <div id="song-view" class="view" hidden>
    <div class="song-tools">
      <button class="icon-button" id="back-button" type="button" aria-label="Til oversigten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="icon-button" id="info-button" type="button" aria-label="Om sangen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      </button>
    </div>

    <article id="song" class="song" aria-live="polite">
      <header class="song-header">
        <p id="song-number" class="song-number"></p>
        <h2 id="song-title" class="song-title"></h2>
      </header>
      <div id="verses" class="verses"></div>
    </article>
  </div>

  <!-- Dialogs -->
  <dialog id="info-dialog" class="sheet">
    <form method="dialog" class="sheet-inner">
      <div class="sheet-head">
        <h2 id="info-title"></h2>
        <button class="close-button" value="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          Luk
        </button>
      </div>
      <p id="info-text" class="info-text"></p>
      <dl id="info-facts" class="facts"></dl>
    </form>
  </dialog>

  <script src="vendor/qrcode.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
